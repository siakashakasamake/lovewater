<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pannello di gestione — Lovewater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--aqua:#3fc1ff;--brand:#007cff;--deep:#010618;--txt:#e9f4ff;--mut:#9fbad6;--gl:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14);--ok:#4ade80;--warn:#ffc46b;--err:#ff7b7b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--txt);font-size:15px;line-height:1.5;background:linear-gradient(180deg,#0b4f86 0%,#06325e 30%,#031a38 65%,#010618 100%) fixed;min-height:100vh}
h1,h2,h3,b,strong,.btn{font-family:'Urbanist',sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--aqua)}
.hide{display:none!important}
.logo{height:30px;width:auto;filter:brightness(0) invert(1)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;font-weight:700;font-size:14px;padding:9px 18px;border-radius:30px;background:linear-gradient(135deg,#3fc1ff,#007cff);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.btn.gh{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.red{background:rgba(255,123,123,.12);border:1px solid rgba(255,123,123,.45);color:#ffd0d0}
.lnk{background:none;border:0;color:var(--aqua);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(60% 50% at 50% 0,rgba(0,124,255,.35),transparent)}
#login .box{width:100%;max-width:360px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:30px 26px;text-align:center;backdrop-filter:blur(8px)}
#login .logo{height:40px;margin-bottom:6px}
#login p{color:var(--mut);font-size:13.5px;margin-bottom:18px}
#login .btn{width:100%;justify-content:center;margin-top:12px}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:rgba(1,8,24,.75);border-right:1px solid rgba(255,255,255,.08);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .logo{margin:0 0 22px 10px}
aside nav button{display:flex;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;font-size:14.5px;margin-bottom:2px}
aside nav button.on{background:linear-gradient(90deg,rgba(63,193,255,.25),rgba(63,193,255,.04));color:#fff;font-weight:700}
aside nav button:hover{color:#fff}
aside .bottom{margin-top:auto}
main{padding:26px 32px 80px;max-width:1080px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:28px;font-weight:400;letter-spacing:-.02em;color:#fff;margin-right:auto}
.dirty{font-size:12.5px;color:var(--warn)}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{display:block;font-size:30px;font-weight:600;color:#fff;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;overflow:hidden}
.noimg{display:grid;place-items:center;color:var(--mut);font-size:11px;text-align:center}
.muted{color:var(--mut);font-size:13px}
h2.sub{font-size:17px;font-weight:700;color:#fff;margin:22px 0 10px}
.ctx{font-family:'Urbanist';font-weight:700;color:var(--aqua);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:24px 0 8px}
.fld{margin-bottom:12px}
.fld label{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.fld input,.fld textarea,.fld select,select.big{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;color:#e6f2ff;outline:none;resize:vertical}
.fld textarea{min-height:44px;line-height:1.45}
.fld input:focus,.fld textarea:focus,.fld select:focus,select.big:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(63,193,255,.2)}
.fld.changed input,.fld.changed textarea{border-color:rgba(63,193,255,.55)}
select option{background:#071a33}
select.big{font-size:15px;max-width:440px}
.hint{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* foto */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:12px}
.ph{background:var(--gl);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.ph .im{position:relative;aspect-ratio:4/3;background:#06152b}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .im.drag{outline:2px dashed var(--aqua);outline-offset:-6px}
.ph .im .ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(1,10,30,.6);color:#fff;font-weight:700;font-family:Urbanist}
.ph .meta{padding:9px 11px}
.ph .meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .meta div{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:1px 8px;background:rgba(63,193,255,.18);color:#bfe8ff}
/* toggle */
.tg{position:relative;width:42px;height:24px;flex:none}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.2);transition:.2s;cursor:pointer}
.tg span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+span{background:var(--aqua)}
.tg input:checked+span::after{left:21px}
.handle{cursor:grab;color:var(--mut);font-size:18px;user-select:none;padding:0 4px}
.arrows button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:7px;width:28px;height:26px;cursor:pointer;color:#fff}
.prow{cursor:pointer}
.prow.sel{background:rgba(63,193,255,.08);border-radius:10px}
.prow.dragging{opacity:.4}
.thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;flex:none;background:#06152b}
.editor{margin-top:14px;border-color:rgba(63,193,255,.4)}
.editor .photos{max-width:340px}
/* faq */
.faqi{border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.04)}
.faqi>.h{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.faqi>.h b{flex:1;font-size:14.5px}
.faqi>.b{padding:0 12px 12px}
/* dialog */
.dlg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(1,6,24,.7);padding:20px}
.dlg .box{width:100%;max-width:400px;background:#0a2445;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:22px}
.dlg p{font-size:16px;color:#fff;margin-bottom:14px}
.dlg input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;margin-bottom:14px;outline:none}
.dlg input:focus{border-color:var(--aqua)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:99;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.ok{background:rgba(20,60,40,.95);border:1px solid rgba(74,222,128,.6);color:#bbf7d0}
#toast.ko{background:rgba(70,20,20,.95);border:1px solid rgba(255,123,123,.6);color:#ffd0d0}
.demo{background:rgba(255,196,107,.12);border:1px solid rgba(255,196,107,.45);color:#ffe2b0;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:16px}
.loading{color:var(--mut);padding:40px 0}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 10px;z-index:20;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}
  aside .logo{height:22px;margin:0 6px 0 2px;flex:none}
  aside nav{display:flex;gap:4px}
  aside nav button{white-space:nowrap;padding:8px 11px;font-size:13.5px;width:auto}
  aside .bottom{margin:0}
  main{padding:18px 14px 90px}
  .top h1{font-size:23px;width:100%}
  .two{grid-template-columns:1fr}
  .grid3{gap:8px}.grid3 .card{padding:12px}.stat b{font-size:21px}.stat span{font-size:11.5px}
  .photos{grid-template-columns:1fr 1fr}
  .handle{display:none}
  .prow .muted{display:none}
  .row{gap:8px}
  .thumb{width:40px;height:40px}
}
</style>
</head>
<body>

<section id="login">
  <form class="box" id="loginForm" autocomplete="on">
    <img class="logo" src="logo.svg" alt="We Love Water">
    <p>Pannello di gestione del sito</p>
    <div class="fld" style="text-align:left"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn" type="submit">Entra</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div id="app" class="hide">
  <aside>
    <img class="logo" src="logo.svg" alt="We Love Water">
    <nav id="menu"></nav>
    <div class="bottom"><nav><button id="logout" type="button">Esci</button></nav></div>
  </aside>
  <main>
    <div id="demoBar" class="demo hide">Modalità dimostrativa: puoi provare tutte le funzioni, ma le modifiche non vengono pubblicate sul sito.</div>
    <div class="top">
      <h1 id="title">Panoramica</h1>
      <span class="dirty hide" id="dirty">Modifiche non salvate</span>
      <a class="btn gh" href="index.html" target="_blank" rel="noopener">Vedi il sito ↗</a>
      <button class="btn" id="save" type="button">Salva</button>
    </div>
    <div id="view"><div class="loading">Caricamento…</div></div>
  </main>
</div>
<div id="toast"></div>
<div id="dlg" class="dlg hide" role="dialog" aria-modal="true" aria-labelledby="dlgMsg"><form class="box" id="dlgForm"><p id="dlgMsg"></p><input id="dlgIn" class="hide"><div class="acts"><button type="button" class="btn gh" id="dlgNo">Annulla</button><button type="submit" class="btn" id="dlgOk">OK</button></div></form></div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" class="hide">

<script>
(function(){
'use strict';
var MENU=[['home','Panoramica'],['testi','Testi'],['foto','Foto'],['prodotti','Prodotti'],['faq','FAQ'],['contatti','Contatti e orari'],['social','Social']];
var KEY='lw-admin', DEMO=false, D=null, C=null, SAVED='', view='home', page=null, selProd=null, openFaq=-1, demoHist=[];
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
var dec=document.createElement('textarea');
function toText(h){h=String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<(b|strong)>([\s\S]*?)<\/\1>/gi,'**$2**').replace(/<[^>]+>/g,'');dec.innerHTML=h;return dec.value.replace(/[ \t]+\n/g,'\n').trim()}
function toHtml(t){return esc(String(t||'').trim()).replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function ask(msg,okLabel,placeholder){
  return new Promise(function(res){
    var d=$('#dlg'),inp=$('#dlgIn');$('#dlgMsg').textContent=msg;$('#dlgOk').textContent=okLabel||'OK';
    inp.value='';inp.placeholder=placeholder||'';inp.classList.toggle('hide',placeholder==null);d.classList.remove('hide');
    (placeholder!=null?inp:$('#dlgOk')).focus();
    var end=function(v){d.classList.add('hide');$('#dlgForm').onsubmit=null;$('#dlgNo').onclick=null;res(v)};
    $('#dlgForm').onsubmit=function(e){e.preventDefault();end(placeholder!=null?inp.value.trim():true)};
    $('#dlgNo').onclick=function(){end(placeholder!=null?'':false)};
  });
}
function toast(msg,ok){var t=$('#toast');t.textContent=msg;t.className='show '+(ok===false?'ko':'ok');clearTimeout(t._t);t._t=setTimeout(function(){t.className=''},2600)}
function key(){try{return sessionStorage.getItem(KEY)||''}catch(e){return ''}}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({'content-type':'application/json','x-admin-key':key()},opt.headers||{});
  return fetch(path,opt).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||('Errore '+r.status));e.status=r.status;throw e}return j})});
}

/* ---------- accesso ---------- */
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();var pw=$('#pw').value;$('#loginErr').textContent='';
  if(DEMO){start();return}
  fetch('/api/login',{method:'POST',headers:{'x-admin-key':pw}}).then(function(r){
    if(r.ok){try{sessionStorage.setItem(KEY,pw)}catch(e){};start()}
    else if(r.status===401){$('#loginErr').textContent='Password non corretta. Controlla maiuscole e spazi.'}
    else{throw new Error()}
  }).catch(function(){$('#loginErr').textContent='Pannello non raggiungibile. Controlla la connessione e riprova.'});
});
$('#logout').addEventListener('click',function(){
  var out=function(){try{sessionStorage.removeItem(KEY)}catch(e){};DIRTY_OK=true;location.reload()};
  if(dirty())ask('Hai modifiche non salvate. Uscire comunque?','Esci senza salvare').then(function(ok){if(ok)out()});else out();
});
var DIRTY_OK=false;window.addEventListener('beforeunload',function(e){if(dirty()&&!DIRTY_OK){e.preventDefault();e.returnValue=''}});

function start(){
  $('#login').classList.add('hide');$('#app').classList.remove('hide');
  if(DEMO)$('#demoBar').classList.remove('hide');
  Promise.all([fetch('cms/defaults.json').then(function(r){return r.json()}),
    DEMO?Promise.resolve({}):fetch('/api/content',{cache:'no-store'}).then(function(r){return r.ok?r.json():{}})])
  .then(function(a){D=a[0];C=norm(a[1]||{});SAVED=JSON.stringify(C);page=D.pages[0].slug;render()})
  .catch(function(){$('#view').innerHTML='<div class="card">Impossibile caricare i contenuti. Ricarica la pagina.</div>'});
}
function norm(c){
  c.texts=c.texts||{};c.imgs=c.imgs||{};c.products=c.products||{};
  c.products.items=c.products.items||{};c.products.extra=c.products.extra||[];
  if(!c.products.order||!c.products.order.length)c.products.order=D.products.map(function(p){return p.id}).concat(c.products.extra.map(function(p){return p.id}));
  c.contatti=Object.assign(clone(D.contatti),c.contatti||{});c.social=Object.assign(clone(D.social),c.social||{});
  return c;
}
function dirty(){return C&&JSON.stringify(C)!==SAVED}
function markDirty(){$('#dirty').classList.toggle('hide',!dirty())}

/* ---------- salvataggio ---------- */
var LAB={testi:'Testi',foto:'Foto',prodotti:'Prodotti',faq:'FAQ',contatti:'Contatti e orari',social:'Social'};
$('#save').addEventListener('click',function(){
  if(!dirty()){toast('Nessuna modifica da salvare');return}
  var pl=D.pages.filter(function(p){return p.slug===page})[0];
  var label=(LAB[view]||'Modifica')+((view==='testi'||view==='foto')&&pl?' · '+pl.label:'');
  var btn=$('#save');btn.disabled=true;btn.textContent='Salvataggio…';
  var done=function(){SAVED=JSON.stringify(C);markDirty();try{sessionStorage.setItem('lw-cms',JSON.stringify(C))}catch(e){};toast('✓ Modifiche salvate e pubblicate')};
  var p=DEMO?new Promise(function(r){setTimeout(function(){demoHist.unshift({id:String(Date.now()),ts:new Date().toISOString(),label:label,snap:clone(C)});r()},400)})
    :api('/api/content',{method:'POST',body:JSON.stringify({content:C,label:label})});
  p.then(done).catch(function(e){toast(e.status===401?'Sessione scaduta: esci e rientra':'Salvataggio non riuscito: '+e.message,false)})
   .then(function(){btn.disabled=false;btn.textContent='Salva'});
});

/* ---------- navigazione ---------- */
function render(){
  $('#menu').innerHTML=MENU.map(function(m){return '<button type="button" data-v="'+m[0]+'" class="'+(m[0]===view?'on':'')+'">'+m[1]+'</button>'}).join('');
  $$('#menu button').forEach(function(b){b.onclick=function(){view=b.dataset.v;render();window.scrollTo(0,0)}});
  $('#title').textContent=MENU.filter(function(m){return m[0]===view})[0][1];
  $('#save').classList.toggle('hide',view==='home');
  ({home:vHome,testi:vTesti,foto:vFoto,prodotti:vProd,faq:vFaq,contatti:vCont,social:vSoc})[view]();
  markDirty();
}
function pageSelect(){
  return '<select class="big" id="psel">'+D.pages.filter(function(p){return view==='testi'?p.texts.length:p.imgs.length}).map(function(p){return '<option value="'+p.slug+'"'+(p.slug===page?' selected':'')+'>'+esc(p.label)+'</option>'}).join('')+'</select>';
}
function bindPsel(){var s=$('#psel');if(s)s.onchange=function(){page=s.value;render()}}
function curPage(list){var p=D.pages.filter(function(x){return x.slug===page&&(view==='testi'?x.texts.length:x.imgs.length)})[0];if(!p){p=D.pages.filter(function(x){return view==='testi'?x.texts.length:x.imgs.length})[0];page=p.slug}return p}

/* ---------- panoramica ---------- */
function hello(){var h=new Date().getHours();return h<13?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera'}
function fmt(ts){try{return new Date(ts).toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ts}}
function vHome(){
  var nprod=C.products.order.length;
  $('#view').innerHTML='<p class="muted" style="margin:-10px 0 18px">'+hello()+' Andrew, da qui puoi aggiornare il sito in autonomia.</p>'+
   '<div class="grid3"><div class="card stat"><b>7</b><span>aree gestibili</span></div><div class="card stat"><b>'+nprod+'</b><span>schede prodotto</span></div><div class="card stat"><b>'+(C.updated?fmt(C.updated).split(',')[0]:'—')+'</b><span>ultima modifica</span></div></div>'+
   '<h2 class="sub">Versioni salvate</h2><div class="card" id="hist"><div class="muted">Caricamento…</div></div>'+
   '<p class="hint">Ogni salvataggio crea una versione. Se qualcosa non ti convince, premi <b>Ripristina</b> e il sito torna com’era.</p>';
  var p=DEMO?Promise.resolve(demoHist):api('/api/history');
  p.then(function(list){
    if(!list.length){$('#hist').innerHTML='<div class="muted">Nessuna modifica salvata finora: il sito mostra i contenuti originali.</div>';return}
    $('#hist').innerHTML=list.map(function(v,i){return '<div class="row"><div class="grow"><b>'+esc(v.label)+'</b><div class="muted">'+fmt(v.ts)+'</div></div>'+(i===0?'<span class="tag">attuale</span>':'<button class="btn gh sm" data-r="'+esc(v.id)+'">Ripristina</button>')+'</div>'}).join('');
    $$('[data-r]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.r;ask('Ripristinare questa versione? Il sito tornerà com’era in quel momento.','Ripristina').then(function(ok){if(!ok)return;
      var q=DEMO?Promise.resolve({content:clone(demoHist.filter(function(v){return v.id===id})[0].snap)}).then(function(r){demoHist.unshift({id:String(Date.now()),ts:new Date().toISOString(),label:'Ripristino di una versione precedente',snap:clone(r.content)});return r})
        :api('/api/history',{method:'POST',body:JSON.stringify({id:id})});
      q.then(function(r){C=norm(r.content);SAVED=JSON.stringify(C);try{sessionStorage.setItem('lw-cms',SAVED)}catch(e){};toast('✓ Versione ripristinata');render()}).catch(function(e){toast('Ripristino non riuscito: '+e.message,false)});});
    }});
  }).catch(function(e){$('#hist').innerHTML='<div class="muted">Versioni non disponibili ('+esc(e.message)+')</div>'});
}

/* ---------- testi ---------- */
function vTesti(){
  var p=curPage();
  var h='<div class="fld"><label>Sezione</label>'+pageSelect()+'</div><p class="hint">Scrivi il nuovo testo e premi <b>Salva</b>. Per il <b>grassetto</b> racchiudi le parole tra due asterischi: **così**. Per andare a capo premi Invio.</p>';
  var last=null;
  p.texts.forEach(function(t){
    if(t.ctx&&t.ctx!==last){h+='<div class="ctx">'+esc(t.ctx)+'</div>';last=t.ctx}
    var L=t.tag==='lines',def=L?t.html:toText(t.html),cur=C.texts[t.k]!=null?(L?C.texts[t.k]:toText(C.texts[t.k])):def,ch=C.texts[t.k]!=null;
    h+='<div class="fld'+(ch?' changed':'')+'" data-f="'+t.k+'"><label><span>'+esc(t.label)+'</span>'+(ch?'<button type="button" class="lnk" data-reset="'+t.k+'">Ripristina originale</button>':'')+'</label><textarea rows="'+Math.max(1,Math.ceil(cur.length/90),cur.split('\n').length)+'">'+esc(cur)+'</textarea></div>';
  });
  $('#view').innerHTML=h;bindPsel();
  $$('[data-f] textarea').forEach(function(ta){
    var k=ta.parentNode.dataset.f,t=p.texts.filter(function(x){return x.k===k})[0];
    var grow=function(){ta.style.height='auto';ta.style.height=ta.scrollHeight+2+'px'};grow();
    ta.addEventListener('input',function(){grow();
      var L=t.tag==='lines';if(ta.value.trim()===(L?t.html:toText(t.html)))delete C.texts[k];else C.texts[k]=L?ta.value.trim():toHtml(ta.value);
      ta.parentNode.classList.toggle('changed',C.texts[k]!=null);markDirty()});
  });
  $$('[data-reset]').forEach(function(b){b.onclick=function(){delete C.texts[b.dataset.reset];render()}});
}

/* ---------- foto ---------- */
function resize(file){
  return new Promise(function(res,rej){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){rej(new Error('Usa una foto JPG, PNG o WEBP'));return}
    if(file.size>15*1024*1024){rej(new Error('La foto supera i 15 MB'));return}
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1920,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res({data:c.toDataURL('image/jpeg',.84),small:w<1200});
    };
    img.onerror=function(){rej(new Error('Foto non leggibile'))};img.src=url;
  });
}
function upload(file){
  return resize(file).then(function(r){
    if(DEMO)return {url:r.data,small:r.small};
    return api('/api/upload',{method:'POST',body:JSON.stringify({type:'image/jpeg',data:r.data.split(',')[1]})}).then(function(j){return {url:j.url,small:r.small}});
  });
}
function pick(cb){var f=$('#file');f.value='';f.onchange=function(){if(f.files[0])cb(f.files[0])};f.click()}
function photoCard(id,src,label,changed){
  return '<div class="ph" data-ph="'+esc(id)+'"><div class="im"><img src="'+esc(src)+'" alt=""></div><div class="meta"><b title="'+esc(label)+'">'+esc(label)+'</b><div><button type="button" class="btn sm" data-up>Sostituisci</button>'+(changed?'<button type="button" class="lnk" data-orig>Ripristina originale</button><span class="tag">modificata</span>':'')+'</div></div></div>';
}
function bindPhotos(onFile,onOrig){
  $$('[data-ph]').forEach(function(card){
    var id=card.dataset.ph,im=$('.im',card);
    var go=function(file){var ov=document.createElement('div');ov.className='ov';ov.textContent='Caricamento…';im.appendChild(ov);
      upload(file).then(function(r){onFile(id,r.url);if(r.small)toast('Foto caricata. È un po’ piccola: se puoi usa l’originale.',true)}).catch(function(e){ov.remove();toast(e.message,false)})};
    $('[data-up]',card).onclick=function(){pick(go)};
    var o=$('[data-orig]',card);if(o)o.onclick=function(){onOrig(id)};
    im.addEventListener('dragover',function(e){e.preventDefault();im.classList.add('drag')});
    im.addEventListener('dragleave',function(){im.classList.remove('drag')});
    im.addEventListener('drop',function(e){e.preventDefault();im.classList.remove('drag');if(e.dataTransfer.files[0])go(e.dataTransfer.files[0])});
  });
}
function vFoto(){
  var p=curPage();
  $('#view').innerHTML='<div class="fld"><label>Sezione</label>'+pageSelect()+'</div><p class="hint">Clicca <b>Sostituisci</b> o trascina una foto sopra quella da cambiare, poi premi <b>Salva</b>. Formato JPG o PNG, orizzontale, almeno 1600 px: il pannello la alleggerisce in automatico.</p><div class="photos">'+
    p.imgs.map(function(i){return photoCard(i.k,C.imgs[i.k]||i.src,i.label,!!C.imgs[i.k])}).join('')+'</div>'+
    (page.indexOf('prodotti')===0?'<p class="hint">Le foto delle schede prodotto si cambiano anche da <b>Prodotti</b>.</p>':'');
  bindPsel();
  bindPhotos(function(id,url){C.imgs[id]=url;render()},function(id){delete C.imgs[id];render()});

/* ---------- prodotti ---------- */
function prodList(){
  var all={};D.products.forEach(function(p){all[p.id]=Object.assign({},p,C.products.items[p.id]||{},{base:true})});
  C.products.extra.forEach(function(p){all[p.id]=Object.assign({},p,{base:false})});
  return C.products.order.filter(function(id){return all[id]}).map(function(id){return all[id]});
}
function setP(id,k,v){
  var ex=C.products.extra.filter(function(p){return p.id===id})[0];
  if(ex){ex[k]=v;return}
  var base=D.products.filter(function(p){return p.id===id})[0],it=C.products.items[id]=C.products.items[id]||{};
  if(v===''||v===base[k]||(k==='hidden'&&!v))delete it[k];else it[k]=v;
  if(!Object.keys(it).length)delete C.products.items[id];
}
function slugify(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'prodotto'}
function vProd(){
  var list=prodList();
  var h='<div class="top" style="margin:-6px 0 8px"><p class="muted" style="margin-right:auto">Trascina ↕ (o usa le frecce) per l’ordine. L’interruttore mostra o nasconde la scheda sul sito.</p><button type="button" class="btn gh" id="newP">+ Nuova scheda</button></div><div class="card" id="plist">'+
   list.map(function(p,i){return '<div class="row prow'+(p.id===selProd?' sel':'')+'" draggable="true" data-id="'+esc(p.id)+'"><span class="handle" title="Trascina">↕</span>'+(p.img?'<img class="thumb" src="'+esc(p.img)+'" alt="">':'<span class="thumb noimg">foto</span>')+'<div class="grow"><b>'+esc(p.name||'Senza nome')+'</b>'+(p.base?'':' <span class="tag">nuova</span>')+'<div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.card||'')+'</div></div><span class="arrows"><button type="button" data-mv="-1" title="Su">↑</button> <button type="button" data-mv="1" title="Giù">↓</button></span><label class="tg" title="Visibile sul sito"><input type="checkbox" data-vis'+(p.hidden?'':' checked')+'><span></span></label></div>'}).join('')+'</div><div id="pedit"></div>';
  $('#view').innerHTML=h;
  $('#newP').onclick=function(){
    ask('Nome della nuova scheda','Crea scheda','Es. Depuratori a carboni attivi').then(function(name){if(!name)return;
    var id=slugify(name),n=1;while(C.products.order.indexOf(id)>-1)id=slugify(name)+'-'+(++n);
    C.products.extra.push({id:id,name:name.trim(),card:'',img:'',title:'',intro:''});C.products.order.push(id);selProd=id;render();});
  };
  $$('.prow').forEach(function(r){
    var id=r.dataset.id;
    r.addEventListener('click',function(e){if(e.target.closest('.arrows,.tg'))return;selProd=selProd===id?null:id;render()});
    $('[data-vis]',r).onchange=function(e){setP(id,'hidden',!e.target.checked);markDirty()};
    $$('[data-mv]',r).forEach(function(b){b.onclick=function(){var o=C.products.order,i=o.indexOf(id),j=i+(+b.dataset.mv);if(j<0||j>=o.length)return;o.splice(i,1);o.splice(j,0,id);render()}});
    r.addEventListener('dragstart',function(e){r.classList.add('dragging');e.dataTransfer.setData('text/plain',id)});
    r.addEventListener('dragend',function(){r.classList.remove('dragging')});
    r.addEventListener('dragover',function(e){e.preventDefault()});
    r.addEventListener('drop',function(e){e.preventDefault();var from=e.dataTransfer.getData('text/plain');if(!from||from===id)return;var o=C.products.order;o.splice(o.indexOf(from),1);o.splice(o.indexOf(id),0,from);render()});
  });
  if(selProd)prodEditor(list.filter(function(p){return p.id===selProd})[0]);
}
function pf(k,label,val,area,hint){return '<div class="fld"><label>'+label+'</label>'+(area?'<textarea data-pk="'+k+'" rows="3">'+esc(val||'')+'</textarea>':'<input data-pk="'+k+'" value="'+esc(val||'')+'">')+(hint?'<p class="hint">'+hint+'</p>':'')+'</div>'}
function prodEditor(p){
  if(!p)return;
  var base=D.products.filter(function(x){return x.id===p.id})[0];
  var h='<div class="card editor"><div class="top" style="margin-bottom:12px"><h1 style="font-size:20px">'+esc(p.name||'Nuova scheda')+'</h1><button type="button" class="btn gh sm" id="pclose">Chiudi</button></div>'+
   '<div class="two"><div>'+pf('name','Nome',p.name)+pf('card','Descrizione breve (nelle schede e nei menu)',p.card,true)+'</div>'+
   '<div><div class="fld"><label>Foto</label></div><div class="photos" style="margin-top:0;grid-template-columns:1fr">'+photoCard(p.id,p.img||'img/og.jpg',p.img?'Foto della scheda':'Nessuna foto: caricane una',!!(base&&C.products.items[p.id]&&C.products.items[p.id].img))+'</div></div></div>';
  if(p.base){
    var pg=D.pages.filter(function(x){return x.slug===base.page.replace('.html','')})[0];
    h+='<p class="hint">Il testo completo della pagina si modifica in <button type="button" class="lnk" id="goTxt">Testi → '+esc(pg?pg.label:'pagina prodotto')+'</button>.</p>';
  }else{
    h+='<div class="ctx">Pagina della scheda</div>'+pf('title','Titolo della pagina',p.title)+pf('intro','Introduzione',p.intro,true)+
     '<div class="two"><div>'+pf('s0e','Blocco 1 · etichetta',p.s0e)+pf('s0t','Blocco 1 · titolo',p.s0t)+pf('s0p','Blocco 1 · testo',p.s0p,true)+'</div><div>'+pf('s1e','Blocco 2 · etichetta',p.s1e)+pf('s1t','Blocco 2 · titolo',p.s1t)+pf('s1p','Blocco 2 · testo',p.s1p,true)+'</div></div>'+
     pf('ctaTitle','Frase finale (invito al contatto)',p.ctaTitle,false,'La pagina viene creata in automatico ed è raggiungibile dal menu Prodotti. I blocchi lasciati vuoti non compaiono.')+
     '<button type="button" class="btn red sm" id="pdel">Elimina scheda</button>';
  }
  $('#pedit').innerHTML=h+'</div>';
  $('#pclose').onclick=function(){selProd=null;render()};
  $$('[data-pk]').forEach(function(i){i.addEventListener('input',function(){setP(p.id,i.dataset.pk,i.value.trim());markDirty();
    if(i.dataset.pk==='name'||i.dataset.pk==='card'){var r=$('.prow[data-id="'+p.id+'"]');if(r){if(i.dataset.pk==='name')$('b',r).textContent=i.value;else $('.muted',r).textContent=i.value}}})});
  bindPhotos(function(id,url){setP(id,'img',url);render()},function(id){setP(id,'img','');render()});
  var g=$('#goTxt');if(g)g.onclick=function(){view='testi';page=base.page.replace('.html','');render();window.scrollTo(0,0)};
  var d=$('#pdel');if(d)d.onclick=function(){ask('Eliminare la scheda «'+p.name+'»?','Elimina').then(function(ok){if(!ok)return;C.products.extra=C.products.extra.filter(function(x){return x.id!==p.id});C.products.order=C.products.order.filter(function(x){return x!==p.id});selProd=null;render()})};
  $('#pedit').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- faq ---------- */
function faqList(){if(!C.faq)C.faq=clone(D.faq);return C.faq}
function vFaq(){
  var f=faqList();
  var h='<div class="top" style="margin:-6px 0 8px"><p class="muted" style="margin-right:auto">Clicca su una domanda per modificarla. Le prime 6 compaiono anche in home e in Contatti.</p><button type="button" class="btn gh" id="newF">+ Nuova domanda</button></div>';
  D.groups.forEach(function(g){
    var items=f.map(function(x,i){return [x,i]}).filter(function(a){return a[0].g===g.id});
    h+='<div class="ctx">'+esc(g.title)+' · '+items.length+'</div>';
    if(!items.length)h+='<p class="muted">Nessuna domanda in questo argomento.</p>';
    items.forEach(function(a){var x=a[0],i=a[1];
      h+='<div class="faqi" data-i="'+i+'"><div class="h"><b>'+esc(x.q||'Nuova domanda')+'</b><span class="arrows"><button type="button" data-fm="-1" title="Su">↑</button> <button type="button" data-fm="1" title="Giù">↓</button></span></div>'+
        (openFaq===i?'<div class="b"><div class="fld"><label>Domanda</label><input data-fk="q" value="'+esc(x.q)+'"></div><div class="fld"><label>Risposta</label><textarea data-fk="a" rows="4">'+esc(toText(x.a))+'</textarea></div><div class="two"><div class="fld"><label>Argomento</label><select data-fk="g">'+D.groups.map(function(gg){return '<option value="'+gg.id+'"'+(gg.id===x.g?' selected':'')+'>'+esc(gg.title)+'</option>'}).join('')+'</select></div><div style="align-self:end;text-align:right;margin-bottom:12px"><button type="button" class="btn red sm" data-fdel>Elimina</button></div></div></div>':'')+'</div>';
    });
  });
  $('#view').innerHTML=h;
  $('#newF').onclick=function(){f.unshift({q:'',a:'',g:D.groups[0].id});openFaq=0;render();var i=$('[data-fk="q"]');if(i)i.focus()};
  $$('.faqi').forEach(function(el){
    var i=+el.dataset.i,x=f[i];
    $('.h',el).addEventListener('click',function(e){if(e.target.closest('.arrows'))return;openFaq=openFaq===i?-1:i;render()});
    $$('[data-fm]',el).forEach(function(b){b.onclick=function(){
      var same=f.map(function(y,j){return j}).filter(function(j){return f[j].g===x.g}),pos=same.indexOf(i),to=same[pos+(+b.dataset.fm)];
      if(to==null)return;var t=f[to];f[to]=x;f[i]=t;if(openFaq===i)openFaq=to;render()}});
    $$('[data-fk]',el).forEach(function(inp){inp.addEventListener(inp.tagName==='SELECT'?'change':'input',function(){
      var k=inp.dataset.fk;x[k]=k==='a'?toHtml(inp.value):inp.value;
      if(k==='q')$('.h b',el).textContent=inp.value||'Nuova domanda';if(k==='g')render();markDirty()})});
    var d=$('[data-fdel]',el);if(d)d.onclick=function(){ask('Eliminare questa domanda?','Elimina').then(function(ok){if(!ok)return;f.splice(i,1);openFaq=-1;render()})};
  });
}
